---
name: "Audit"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  schedule:
  - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Audit:
    runs-on: "ubuntu-24.04"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-go@v5"
      with:
        go-version: "1.27.0"
    - uses: "dtolnay/rust-toolchain@stable"
      with:
        toolchain: "1.97.1"
    - name: "provision dev tools"
      run: "make -f install.mk"
    - run: "make audit"
